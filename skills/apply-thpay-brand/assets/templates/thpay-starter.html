<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFF9F1" />
  <title>ThPay — Pessoas movem o amanhã</title>
  <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./brand/thpay.css" />
  <style>
    *{box-sizing:border-box} body{margin:0;background:var(--thp-bg);color:var(--thp-text);font-family:var(--thp-font-sans)}
    .page{max-width:1180px;margin:auto;padding:32px 20px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;min-height:70vh}
    .hero h1{font-size:clamp(2.5rem,7vw,5.7rem);line-height:.98;letter-spacing:-.055em;margin:24px 0}.hero p{font-size:1.15rem;line-height:1.6;color:var(--thp-text-muted);max-width:58ch}
    .blocks{min-height:420px;border-radius:28px;background:url('./brand/connection-blocks.svg') center/cover no-repeat}.logo{width:min(320px,70vw)}
    @media(max-width:760px){.hero{grid-template-columns:1fr}.blocks{min-height:300px}}
  </style>
</head>
<body>
  <main class="page">
    <header><img class="logo" src="./brand/thpay-primary-dark.svg" alt="ThPay" /></header>
    <section class="hero">
      <div>
        <p><strong>Pessoas movem o amanhã.</strong></p>
        <h1>Tecnologia que cuida do processo e das pessoas.</h1>
        <p>Uma experiência de folha mais clara, organizada e humana para quem opera e para quem recebe.</p>
      </div>
      <div class="blocks" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
